<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C Hive Sage browser regressions</title>
  <style>
    body { margin: 24px; color: #211e1a; background: #f5f1e9; font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; }
    iframe { position: absolute; width: 390px; height: 700px; border: 0; opacity: 0; pointer-events: none; }
    li { margin: 7px 0; }
    .pass { color: #286337; }
    .fail { color: #a12622; }
  </style>
</head>
<body>
  <main>
    <h1>Browser regression results</h1>
    <p id="summary" role="status">Running…</p>
    <ol id="results"></ol>
  </main>
  <iframe id="appFrame" src="index.html" title="Application under test"></iframe>
  <script>
    'use strict';

    const frame = document.getElementById('appFrame');
    const results = document.getElementById('results');
    const cases = [];

    function test(name, run) {
      cases.push({ name, run });
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    function delay(milliseconds) {
      return new Promise((resolve) => window.setTimeout(resolve, milliseconds));
    }

    function waitForFrame() {
      if (frame.contentDocument && frame.contentDocument.getElementById('appShell')) return Promise.resolve();
      return new Promise((resolve) => {
        frame.addEventListener('load', resolve, { once: true });
      });
    }

    test('configured cross-report questions', async (win, doc) => {
      const configs = win.eval('reportConfigs');
      const targets = Object.entries(configs).filter(([key]) => key !== 'customer_type');
      for (const [targetKey, config] of targets) {
        assert(config.questions.length > 0, `${targetKey} has no configured questions`);
        for (const question of config.questions) {
          const response = win.pickResponse(question, 'customer_type');
          assert(response.relevanceStatus === 'cross_report', `${question} did not use the cross-report route`);
          assert(response.targetKey === targetKey, `${question} routed to ${response.targetKey}`);
          const pendingResponse = win.pickResponse(question, targetKey);
          assert(pendingResponse.relevanceStatus === 'in_scope_unanswered', `${targetKey} did not retain pending-route priority`);
        }
      }
    });

    test('IME composition Enter', async (win, doc) => {
      win.startNewChat();
      const input = doc.getElementById('questionInput');
      const messages = doc.getElementById('messageList');
      input.value = '中';
      input.dispatchEvent(new CompositionEvent('compositionstart', { bubbles: true, data: '中' }));
      const composingEnter = new KeyboardEvent('keydown', {
        key: 'Enter', bubbles: true, cancelable: true, isComposing: true
      });
      input.dispatchEvent(composingEnter);
      input.dispatchEvent(new CompositionEvent('compositionend', { bubbles: true, data: '中' }));
      assert(messages.children.length === 0, 'composition Enter submitted a message');
      assert(!composingEnter.defaultPrevented, 'composition Enter was prevented');

      const legacyEnter = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
      Object.defineProperty(legacyEnter, 'keyCode', { value: 229 });
      input.dispatchEvent(legacyEnter);
      assert(messages.children.length === 0, 'legacy IME Enter submitted a message');
      assert(!legacyEnter.defaultPrevented, 'legacy IME Enter was prevented');

      input.value = '保留换行';
      const shiftedEnter = new KeyboardEvent('keydown', { key: 'Enter', shiftKey: true, bubbles: true, cancelable: true });
      input.dispatchEvent(shiftedEnter);
      assert(messages.children.length === 0 && !shiftedEnter.defaultPrevented, 'Shift+Enter did not preserve multiline input');

      input.value = '购买频次是如何计算的？';
      const normalEnter = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true });
      input.dispatchEvent(normalEnter);
      assert(normalEnter.defaultPrevented && messages.querySelectorAll('.message.user').length === 1, 'plain Enter did not submit once');
      await delay(750);
      assert(!doc.getElementById('sendBtn').disabled, 'plain Enter response did not finish');
    });

    test('visible composer focus', async (win, doc) => {
      const input = doc.getElementById('questionInput');
      input.focus();
      const style = win.getComputedStyle(doc.querySelector('.composer-box'));
      assert(input.matches(':focus-visible'), 'textarea is not in the focus-visible state');
      assert(style.outlineStyle !== 'none' && Number.parseFloat(style.outlineWidth) > 0, 'composer focus outline is not visible');
    });

    test('fault recovery finally', async (win, doc) => {
      win.startNewChat();
      const originalRenderAnswer = win.renderAnswer;
      win.renderAnswer = () => { throw new Error('injected render failure'); };
      try {
        win.sendQuestion('故障注入');
        assert(doc.getElementById('sendBtn').disabled, 'send was not disabled during loading');
        assert(doc.getElementById('newChatBtn').disabled, 'new chat was not disabled during loading');
        await delay(750);
        assert(!doc.getElementById('sendBtn').disabled, 'send stayed disabled after failure');
        assert(!doc.getElementById('newChatBtn').disabled, 'new chat stayed disabled after failure');
        assert(!doc.getElementById('typingIndicator'), 'typing indicator survived failure');
        assert(doc.querySelector('.error-message[role="alert"]'), 'accessible error message was not rendered');
        assert(win.eval('appState.isTyping') === false, 'isTyping stayed true after failure');
        assert(doc.activeElement === doc.getElementById('questionInput'), 'focus did not return to the input after failure');

        win.renderAnswer = originalRenderAnswer;
        win.sendQuestion('购买频次是如何计算的？');
        await delay(750);
        assert(!doc.getElementById('sendBtn').disabled, 'page did not accept a question after recovery');
        assert([...doc.querySelectorAll('.answer-title')].some((node) => node.textContent === '结论'), 'normal answer did not render after recovery');
      } finally {
        win.renderAnswer = originalRenderAnswer;
      }
    });

    test('custom report menu and context synchronization', async (win, doc) => {
      assert(typeof win.applyReportSelection === 'function', 'unified report selection entry point is missing');
      const trigger = doc.getElementById('reportTrigger');
      trigger.click();
      assert(trigger.getAttribute('aria-expanded') === 'true' && !doc.getElementById('reportMenu').hidden, 'menu did not open');
      doc.querySelector('[data-report-option="product"]').click();
      assert(doc.getElementById('reportTitle').textContent === 'Product', 'report title did not update');
      assert(doc.getElementById('knowledgeLabel').textContent.includes('Product'), 'knowledge label did not update');
      assert(doc.getElementById('questionInput').placeholder.includes('Product'), 'input prompt did not update for Product');
      assert(doc.getElementById('reportMenu').hidden, 'menu did not close after selection');
    });

    test('report menu dismissal and keyboard selection', async (win, doc) => {
      frame.style.width = '842px';
      await delay(50);
      win.syncSidebarAccessibility();
      const trigger = doc.getElementById('reportTrigger');
      const menu = doc.getElementById('reportMenu');
      trigger.click();
      const menuStyle = win.getComputedStyle(menu);
      assert(Number.parseFloat(menuStyle.borderRadius) >= 16 && Number.parseFloat(menuStyle.borderTopWidth) === 0,
        'report popup lost its rounded borderless appearance');
      const optionRect = doc.activeElement.getBoundingClientRect();
      const visibleOption = doc.elementFromPoint(optionRect.left + optionRect.width / 2, optionRect.top + optionRect.height / 2);
      assert(visibleOption === doc.activeElement, 'report popup is layered beneath following sidebar content');
      assert(doc.activeElement.dataset.reportOption === 'product', 'selected report did not receive focus');
      doc.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
      assert(menu.hidden && trigger.getAttribute('aria-expanded') === 'false', 'Escape did not close the report menu');
      assert(doc.activeElement === trigger, 'Escape did not return focus to the report trigger');
      assert(doc.getElementById('reportTitle').textContent === 'Product', 'Escape changed the selected report');

      trigger.click();
      doc.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true, cancelable: true }));
      assert(doc.activeElement.dataset.reportOption === 'member_tier', 'ArrowDown did not move to the next report');
      doc.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
      assert(doc.getElementById('reportTitle').textContent === 'Member Tier', 'Enter did not select the focused report');
      assert(menu.hidden && doc.activeElement === trigger, 'keyboard selection did not close menu and restore focus');

      trigger.click();
      doc.querySelector('.topbar').click();
      assert(menu.hidden && trigger.getAttribute('aria-expanded') === 'false', 'outside click did not close the menu');
      assert(doc.getElementById('reportTitle').textContent === 'Member Tier', 'outside click changed the selected report');
    });

    test('new chat restores welcome and retains report', async (win, doc) => {
      win.applyReportSelection('product');
      win.startNewChat();
      win.sendQuestion('Product 的指标如何计算？');
      await delay(750);
      assert(doc.querySelectorAll('.message.user').length === 1, 'question did not enter the conversation');
      doc.getElementById('newChatBtn').click();
      assert(!doc.getElementById('welcomeState').hidden, 'new chat did not restore the welcome state');
      assert(doc.getElementById('messageList').children.length === 0, 'new chat retained messages');
      assert(doc.getElementById('reportTitle').textContent === 'Product', 'new chat discarded the selected report');
      assert(doc.activeElement === doc.getElementById('questionInput'), 'new chat did not focus the input');
    });

    test('citation and feedback ARIA', async (win, doc) => {
      win.startNewChat();
      const snapshot = { key: 'customer_type', name: 'Customer Type', knowledgePackageName: 'Customer Type 知识包 <em>快照</em>' };
      const response = win.pickResponse('购买频次是如何计算的？', 'customer_type');
      win.renderAnswer(response, snapshot);
      win.renderAnswer(response, snapshot);
      const toggles = [...doc.querySelectorAll('.citation-toggle')];
      const ids = toggles.map((button) => button.getAttribute('aria-controls'));
      assert(ids.every(Boolean) && new Set(ids).size === ids.length, 'citation ids are missing or duplicated');
      assert(toggles.every((button) => button.querySelector('.citation-chevron')), 'citation toggle is missing its chevron');
      assert(toggles.every((button) => doc.getElementById(button.getAttribute('aria-controls')).querySelector('strong').textContent.startsWith('Customer Type ·')), 'citation snapshot title drifted with the current report');
      const citation = doc.getElementById(ids[0]);
      assert(citation && citation.hidden, 'citation does not start collapsed');
      const chevron = toggles[0].querySelector('.citation-chevron');
      const collapsedTransform = win.getComputedStyle(chevron).transform;
      toggles[0].click();
      await delay(200);
      assert(toggles[0].getAttribute('aria-expanded') === 'true' && !citation.hidden && citation.classList.contains('open'), 'click did not open the citation and synchronize its ARIA state');
      const expandedTransform = win.getComputedStyle(chevron).transform;
      assert(expandedTransform !== collapsedTransform, 'citation chevron did not rotate on expansion');
      assert(citation.querySelector('.citation-package')?.textContent === `知识包：${snapshot.knowledgePackageName}`, 'expanded citation did not retain the question-time knowledge package');
      assert(!citation.querySelector('.citation-package em'), 'knowledge package text was not escaped');
      toggles[0].click();
      await delay(200);
      assert(toggles[0].getAttribute('aria-expanded') === 'false' && citation.hidden && !citation.classList.contains('open'), 'click did not close the citation and synchronize its ARIA state');
      assert(win.getComputedStyle(chevron).transform === collapsedTransform, 'citation chevron did not return to its collapsed state');

      const feedbackGroups = [...doc.querySelectorAll('.feedback')];
      const firstButtons = [...feedbackGroups[0].querySelectorAll('button')];
      const secondButtons = [...feedbackGroups[1].querySelectorAll('button')];
      assert([...firstButtons, ...secondButtons].every((button) => button.getAttribute('aria-pressed') === 'false'), 'feedback did not start unpressed');
      win.submitFeedback(firstButtons[0], 'up');
      assert(firstButtons[0].getAttribute('aria-pressed') === 'true' && firstButtons[1].getAttribute('aria-pressed') === 'false', 'positive feedback state is not exclusive');
      win.submitFeedback(firstButtons[1], 'down');
      assert(firstButtons[0].getAttribute('aria-pressed') === 'false' && firstButtons[1].getAttribute('aria-pressed') === 'true', 'negative feedback state is not exclusive');
      assert(secondButtons.every((button) => button.getAttribute('aria-pressed') === 'false'), 'feedback selection leaked into another answer');
    });

    test('overlay accessibility state', async (win, doc) => {
      frame.style.width = '390px';
      await delay(50);
      win.syncSidebarAccessibility();
      const overlay = doc.getElementById('sidebarOverlay');
      const menu = doc.getElementById('mobileMenuBtn');
      assert(win.matchMedia('(max-width: 767px)').matches, 'test iframe is not using the mobile breakpoint');
      assert(overlay.hidden && overlay.getAttribute('aria-hidden') === 'true' && overlay.tabIndex === -1, 'closed overlay remains exposed');
      menu.focus();
      win.openSidebar();
      assert(!overlay.hidden && overlay.getAttribute('aria-hidden') === 'false' && overlay.tabIndex === 0, 'open overlay is not exposed');
      assert(menu.getAttribute('aria-expanded') === 'true', 'menu did not expose the open state');
      await delay(230);
      assert(doc.activeElement === doc.getElementById('newChatBtn'), 'open sidebar did not move focus to its first action');
      doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await delay(240);
      assert(overlay.hidden && overlay.getAttribute('aria-hidden') === 'true' && overlay.tabIndex === -1, 'Escape did not hide the overlay');
      assert(menu.getAttribute('aria-expanded') === 'false' && doc.activeElement === menu, 'Escape did not restore menu state and focus');

      win.openSidebar();
      overlay.click();
      assert(overlay.hidden && menu.getAttribute('aria-expanded') === 'false', 'overlay click did not close the sidebar');

      frame.style.width = '900px';
      await delay(50);
      win.syncSidebarAccessibility();
      assert(!win.matchMedia('(max-width: 767px)').matches, 'test iframe did not reach the desktop breakpoint');
      assert(overlay.hidden && doc.getElementById('sidebar').getAttribute('aria-hidden') === 'false', 'desktop resize left mobile accessibility state behind');
      frame.style.width = '390px';
    });

    const pageErrors = [];
    test('runtime page errors', async () => {
      assert(pageErrors.length === 0, `page emitted errors: ${pageErrors.join('; ')}`);
    });

    async function run() {
      await waitForFrame();
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      win.addEventListener('error', (event) => pageErrors.push(event.message || 'uncaught error'));
      win.addEventListener('unhandledrejection', (event) => pageErrors.push(String(event.reason)));
      const originalConsoleError = win.console.error;
      win.console.error = (...args) => {
        pageErrors.push(args.map(String).join(' '));
        originalConsoleError.apply(win.console, args);
      };
      let failures = 0;
      for (const entry of cases) {
        const item = document.createElement('li');
        try {
          await entry.run(win, doc);
          item.className = 'pass';
          item.textContent = `PASS: ${entry.name}`;
        } catch (error) {
          failures += 1;
          item.className = 'fail';
          item.textContent = `FAIL: ${entry.name} — ${error.message}`;
        }
        results.appendChild(item);
      }
      const summary = document.getElementById('summary');
      summary.textContent = failures ? `${failures}/${cases.length} browser regressions failed` : `PASS: ${cases.length}/${cases.length} browser regressions`;
      summary.className = failures ? 'fail' : 'pass';
      document.body.dataset.status = failures ? 'fail' : 'pass';
      document.title = failures ? 'FAIL: C Hive Sage browser regressions' : 'PASS: C Hive Sage browser regressions';
    }

    run();
  </script>
</body>
</html>
