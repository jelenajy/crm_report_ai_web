<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consumer Hive C Hive Sage 指标顾问工作台">
  <title>C Hive Sage｜指标顾问</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #211e1a;
      --muted: #736d64;
      --canvas: #f5f1e9;
      --paper: #fffdf9;
      --sidebar: #171714;
      --sidebar-soft: #24231f;
      --line: #ddd4c7;
      --gold: #c8a66b;
      --gold-strong: #e0c38f;
      --gold-wash: #f4ead7;
      --danger-wash: #fff4e9;
      --success: #64876d;
      --shadow: 0 16px 48px rgba(42, 35, 24, 0.09);
      --sidebar-width: 272px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, select, textarea { font: inherit; }

    button, select { cursor: pointer; }

    button:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(200, 166, 107, 0.42);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      height: 100dvh;
      min-height: 520px;
    }

    .sidebar {
      position: relative;
      z-index: 30;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 22px 18px 18px;
      color: #f7f1e6;
      background:
        radial-gradient(circle at 22% 0%, rgba(200, 166, 107, 0.14), transparent 28%),
        var(--sidebar);
      border-right: 1px solid rgba(255, 255, 255, 0.07);
    }

    .consumer-hive-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 1px 4px 25px;
    }

    .hive-mark {
      position: relative;
      flex: 0 0 auto;
      width: 38px;
      height: 42px;
    }

    .hive-mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .star-halo { fill: rgba(200, 166, 107, 0.12); stroke: rgba(224, 195, 143, 0.42); transform-origin: 24px 26px; animation: starHalo 3.6s ease-in-out infinite; }
    .north-star { fill: var(--gold-strong); transform-origin: 24px 26px; animation: northStarTwinkle 3.6s ease-in-out infinite; }
    .star-core { fill: #fff9e9; }

    .consumer-hive-brand span,
    .consumer-hive-brand strong,
    .consumer-hive-brand small { display: block; }
    .consumer-hive-brand span { color: var(--gold-strong); font-size: 9px; font-weight: 700; letter-spacing: 0.18em; }
    .consumer-hive-brand strong { margin-top: 3px; color: #fffaf0; font-family: Georgia, "Songti SC", serif; font-size: 17px; font-weight: 500; letter-spacing: 0.015em; }
    .consumer-hive-brand small { margin-top: 2px; color: #aaa49a; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; }

    .new-chat {
      width: 100%;
      min-height: 44px;
      border: 1px solid rgba(224, 195, 143, 0.48);
      border-radius: 15px;
      color: #fffaf0;
      background: rgba(200, 166, 107, 0.12);
      transition: background 160ms ease, border-color 160ms ease;
    }

    .new-chat:not(:disabled):hover { background: rgba(200, 166, 107, 0.22); border-color: var(--gold); }
    .new-chat:disabled { cursor: not-allowed; opacity: 0.5; }

    .sidebar-section { margin-top: 24px; }
    .sidebar-label { display: block; margin: 0 2px 9px; color: #aaa49a; font-size: 11px; letter-spacing: 0.12em; }

    .report-control {
      position: relative;
      border-radius: 18px;
    }

    .report-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid #45423a;
      border-radius: 14px;
      color: #f7f2e9;
      background: linear-gradient(145deg, #292822, var(--sidebar-soft));
      text-align: left;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
    }

    .report-trigger-chevron {
      color: var(--gold-strong);
      font-size: 14px;
      transition: transform 160ms ease;
    }

    .report-trigger[aria-expanded="true"] .report-trigger-chevron { transform: rotate(180deg); }

    .report-menu {
      position: absolute;
      z-index: 45;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      display: grid;
      gap: 3px;
      padding: 7px;
      border: 0;
      border-radius: 16px;
      background: #2b2924;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
    }

    .report-menu[hidden] { display: none; }

    .report-option {
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-radius: 10px;
      color: #d8d1c7;
      background: transparent;
      text-align: left;
    }

    .report-option:hover,
    .report-option[aria-selected="true"] { color: #fffaf0; background: rgba(200, 166, 107, 0.14); }

    .report-option[aria-selected="true"]::after {
      float: right;
      color: var(--gold-strong);
      content: "✓";
    }

    .knowledge-card {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.035);
    }

    .knowledge-card strong { display: block; color: #e7ded0; font-size: 12px; font-weight: 600; }
    .knowledge-status { display: flex; align-items: center; gap: 7px; margin-top: 7px; color: #aaa49a; font-size: 11px; }
    .knowledge-status::before { width: 7px; height: 7px; content: ""; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(100, 135, 109, 0.13); }
    .knowledge-status.pending::before { background: var(--gold); box-shadow: 0 0 0 3px rgba(200, 166, 107, 0.12); }

    .recent { min-height: 0; overflow: auto; }
    .recent-empty, .history-item { padding: 10px 11px; border-radius: 9px; color: #aaa49a; font-size: 12px; line-height: 1.45; }
    .history-item { overflow: hidden; color: #e3ddd3; background: rgba(255, 255, 255, 0.055); text-overflow: ellipsis; white-space: nowrap; }
    .conversation-note { display: block; margin-top: 5px; color: #aaa49a; font-size: 10px; }

    .sidebar-footer {
      margin-top: auto;
      padding: 15px 4px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #8f8a82;
      font-size: 10px;
      line-height: 1.55;
    }

    .workspace { position: relative; display: grid; grid-template-rows: 68px minmax(0, 1fr) auto; min-width: 0; min-height: 0; }

    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 28px;
      border-bottom: 1px solid rgba(125, 114, 97, 0.15);
      background: rgba(245, 241, 233, 0.9);
      backdrop-filter: blur(14px);
    }

    .mobile-menu {
      display: none;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: var(--paper);
      font-size: 20px;
    }

    .report-heading { min-width: 0; }
    .report-heading h1 { overflow: hidden; margin: 0; font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .report-heading p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .top-status { display: inline-flex; align-items: center; gap: 6px; }
    .top-status::before { width: 6px; height: 6px; content: ""; border-radius: 50%; background: var(--success); }
    .top-status.pending::before { background: var(--gold); }

    .conversation {
      min-height: 0;
      overflow: auto;
      scroll-behavior: smooth;
      scrollbar-color: #cfc5b6 transparent;
    }

    .conversation-inner { width: min(900px, calc(100% - 48px)); min-height: 100%; margin: 0 auto; padding: 38px 0 40px; }

    .welcome-state { display: grid; place-items: center; min-height: calc(100dvh - 270px); }
    .welcome-state[hidden] { display: none; }
    .welcome-panel { width: min(690px, 100%); text-align: center; }
    .welcome-kicker { margin-bottom: 12px; color: #97784a; font-size: 10px; font-weight: 700; letter-spacing: 0.2em; }
    .welcome-panel h1 { margin: 0; font-family: Georgia, "Songti SC", serif; font-size: clamp(30px, 4.4vw, 46px); font-weight: 500; letter-spacing: -0.03em; }
    .welcome-panel h1 span { color: #9a7640; }
    .welcome-copy { max-width: 590px; margin: 15px auto 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .quick-title { margin: 33px 0 12px; text-align: left; color: var(--muted); font-size: 12px; }
    .quick-questions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .quick-question {
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: rgba(255, 253, 249, 0.75);
      text-align: left;
      line-height: 1.45;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .quick-question:hover { transform: translateY(-1px); border-color: var(--gold); background: var(--paper); }

    .message-list { display: grid; gap: 28px; }
    .message { display: flex; gap: 12px; animation: reveal 220ms ease both; }
    .message.user { justify-content: flex-end; }
    .message.assistant { align-items: flex-start; }
    .message .avatar { display: grid; place-items: center; flex: 0 0 30px; height: 30px; margin-top: 2px; border: 1px solid var(--line); border-radius: 9px; color: #8f7140; background: var(--paper); font-size: 13px; }
    .message.user .bubble { max-width: min(76%, 650px); padding: 11px 15px; border-radius: 16px 16px 4px 16px; color: #fffaf2; background: #28251f; line-height: 1.6; white-space: pre-wrap; }
    .message.assistant .bubble { width: min(100%, 800px); min-width: 0; color: #39342d; line-height: 1.65; }

    .answer-boundary { display: inline-flex; align-items: center; margin-bottom: 10px; padding: 3px 8px; border: 1px solid #dac49d; border-radius: 999px; color: #896d3f; background: var(--gold-wash); font-size: 10px; }
    .answer-title { margin-bottom: 5px; color: #82745e; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; }
    .answer-lead { font-size: 15px; }
    .answer-section { margin-top: 17px; padding-top: 15px; border-top: 1px solid var(--line); }
    .answer-section h3 { margin: 0 0 7px; font-size: 12px; }
    .formula { padding: 10px 12px; border-left: 3px solid var(--gold); border-radius: 0 8px 8px 0; background: var(--gold-wash); }
    .rule-list { margin: 7px 0 0; padding-left: 20px; }
    .rule-list li + li { margin-top: 5px; }
    .scope-note { margin-top: 15px; color: var(--muted); font-size: 11px; }

    .ticket, .scope-guide, .report-recommendation {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #ddc9a5;
      border-radius: 12px;
      background: var(--danger-wash);
    }
    .ticket strong, .report-recommendation strong { display: block; margin-bottom: 4px; }
    .ticket-code { margin-top: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .scope-guide { background: var(--paper); }
    .scope-guide ul { margin: 7px 0 0; padding-left: 19px; }
    .report-recommendation button { margin-top: 10px; padding: 7px 10px; border: 1px solid #c8a66b; border-radius: 8px; color: #614a28; background: #fffaf0; }
    .error-message { padding: 14px; border: 1px solid #d9b98e; border-radius: 12px; background: var(--danger-wash); }

    .citation-toggle {
      margin-top: 13px;
      padding: 4px 0;
      border: 0;
      color: #856b42;
      background: transparent;
      font-size: 12px;
    }
    .citation-chevron { display: inline-block; transition: transform 160ms ease; }
    .citation-toggle[aria-expanded="true"] .citation-chevron { transform: rotate(180deg); }
    .citations { display: none; margin-top: 6px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); font-size: 12px; }
    .citations.open { display: block; }
    .citations strong, .citations small { display: block; }
    .citations small { margin-top: 3px; color: var(--muted); }

    .suggestions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 15px; }
    .suggestion { padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; color: #665a4a; background: transparent; font-size: 11px; }
    .suggestion:hover { border-color: var(--gold); background: var(--gold-wash); }
    .feedback { display: flex; align-items: center; gap: 5px; margin-top: 13px; color: var(--muted); font-size: 11px; }
    .feedback button { width: 30px; height: 28px; padding: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; filter: grayscale(1); }
    .feedback button:hover, .feedback button.selected { border-color: var(--line); background: var(--paper); filter: none; }

    .typing-bubble { display: flex; align-items: center; gap: 5px; min-height: 32px; color: var(--muted); font-size: 12px; }
    .typing-bubble i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulse 1s infinite ease-in-out; }
    .typing-bubble i:nth-child(2) { animation-delay: 130ms; }
    .typing-bubble i:nth-child(3) { animation-delay: 260ms; }

    .composer { position: relative; z-index: 4; padding: 12px 24px 17px; border-radius: 17px; background: linear-gradient(to top, var(--canvas) 76%, rgba(245, 241, 233, 0)); }
    .composer-inner { width: min(900px, 100%); margin: 0 auto; }
    .composer-box { display: flex; align-items: flex-end; gap: 10px; padding: 9px 9px 9px 15px; border: 1px solid #d2c8ba; border-radius: 19px; background: var(--paper); box-shadow: 0 10px 32px rgba(47, 39, 29, 0.08); }
    .composer-box:focus-within { border-color: #9a7740; outline: 3px solid rgba(154, 119, 64, 0.35); outline-offset: 2px; }
    .composer textarea { flex: 1; max-height: 132px; min-height: 34px; padding: 7px 0 5px; resize: none; overflow-y: auto; border: 0; color: var(--ink); background: transparent; line-height: 1.45; }
    .composer textarea::placeholder { color: #9b9489; }
    .send-button { display: grid; place-items: center; flex: 0 0 38px; height: 38px; padding: 0; border: 0; border-radius: 12px; color: #fff9ef; background: #28251f; font-size: 17px; }
    .send-button:disabled { cursor: not-allowed; opacity: 0.42; }
    .composer-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 7px; padding: 0 4px; color: #736d64; font-size: 10px; }

    .sidebar-overlay { position: fixed; z-index: 20; inset: 0; display: none; border: 0; background: rgba(18, 17, 15, 0.46); opacity: 0; transition: opacity 180ms ease; }
    .sidebar-overlay[hidden] { display: none; }
    .toast { position: fixed; z-index: 60; left: 50%; bottom: 25px; max-width: calc(100vw - 32px); padding: 10px 15px; border: 1px solid rgba(224, 195, 143, 0.35); border-radius: 10px; color: #fff9ef; background: #26231e; box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translate(-50%, 14px); pointer-events: none; transition: opacity 180ms ease, transform 180ms ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @keyframes pulse { 0%, 70%, 100% { opacity: 0.35; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-2px); } }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } }
    @keyframes northStarTwinkle { 0%, 100% { opacity: 0.72; transform: scale(0.94) rotate(-2deg); } 50% { opacity: 1; transform: scale(1.04) rotate(2deg); } }
    @keyframes starHalo { 0%, 100% { opacity: 0.36; transform: scale(0.86); } 50% { opacity: 0.8; transform: scale(1.14); } }

    @media (max-width: 767px) {
      .app-shell { display: block; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: min(var(--sidebar-width), calc(100vw - 44px)); transform: translateX(-104%); transition: transform 190ms ease; box-shadow: 14px 0 40px rgba(0, 0, 0, 0.24); }
      .app-shell.sidebar-open .sidebar { transform: translateX(0); }
      .sidebar-overlay { display: block; pointer-events: none; }
      .app-shell.sidebar-open .sidebar-overlay { opacity: 1; pointer-events: auto; }
      .workspace { height: 100dvh; grid-template-rows: 61px minmax(0, 1fr) auto; }
      .topbar { padding: 0 15px; }
      .mobile-menu { display: block; }
      .conversation-inner { width: min(100% - 28px, 900px); padding-top: 28px; }
      .welcome-state { min-height: calc(100dvh - 252px); }
      .welcome-panel h1 { font-size: 32px; }
      .quick-questions { grid-template-columns: 1fr; }
      .message-list { gap: 23px; }
      .message.user .bubble { max-width: 88%; }
      .composer { padding: 10px 14px 12px; }
      .composer-meta span:first-child { display: none; }
      .composer-meta { justify-content: flex-end; }
    }

    @media (prefers-reduced-motion: reduce) {
      .north-star, .star-halo, .spark-rays { animation: none; }
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar" aria-label="工作台导航">
      <div class="consumer-hive-brand">
        <div class="hive-mark" aria-label="Consumer Hive 北极星标识">
          <svg viewBox="0 0 48 52" role="img" aria-hidden="true">
            <circle class="star-halo" cx="24" cy="26" r="10.5"></circle>
            <path class="north-star" d="M24 1L27.4 19.4L36.5 13.5L30.4 22.4L45 26L30.4 29.6L36.5 38.5L27.4 32.6L24 49L20.6 32.6L11.5 38.5L17.6 29.6L3 26L17.6 22.4L11.5 13.5L20.6 19.4Z"></path>
            <circle class="star-core" cx="24" cy="26" r="2.7"></circle>
          </svg>
        </div>
        <div><span>CONSUMER HIVE</span><strong>C Hive Sage</strong><small>指标顾问</small></div>
      </div>

      <button class="new-chat" id="newChatBtn" type="button">＋ 新建对话</button>

      <section class="sidebar-section" aria-labelledby="reportSelectLabel">
        <div class="sidebar-label" id="reportSelectLabel">当前报表</div>
        <div class="report-control">
          <button class="report-trigger" id="reportTrigger" type="button" aria-haspopup="listbox" aria-controls="reportMenu" aria-expanded="false">
            <span id="reportTriggerValue">Customer Type</span><span class="report-trigger-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="report-menu" id="reportMenu" role="listbox" aria-label="选择报表" hidden>
            <button class="report-option" type="button" role="option" aria-selected="true" tabindex="-1" data-report-option="customer_type">Customer Type</button>
            <button class="report-option" type="button" role="option" aria-selected="false" tabindex="-1" data-report-option="product">Product</button>
            <button class="report-option" type="button" role="option" aria-selected="false" tabindex="-1" data-report-option="member_tier">Member Tier</button>
            <button class="report-option" type="button" role="option" aria-selected="false" tabindex="-1" data-report-option="binding">Binding</button>
            <button class="report-option" type="button" role="option" aria-selected="false" tabindex="-1" data-report-option="nps">NPS</button>
          </div>
        </div>
        <div class="knowledge-card" aria-live="polite">
          <strong id="knowledgeLabel">Customer Type 知识包</strong>
          <span class="knowledge-status" id="knowledgeStatus">已加载</span>
        </div>
      </section>

      <section class="sidebar-section recent" aria-labelledby="recentHeading">
        <h2 class="sidebar-label" id="recentHeading">最近对话</h2>
        <div id="recentConversation">
          <div class="recent-empty">首次提问后显示当前会话标题<span class="conversation-note">当前会话 · 刷新后重置</span></div>
        </div>
      </section>

      <footer class="sidebar-footer">
        回答基于已审核知识内容，请结合正式业务口径使用
      </footer>
    </aside>

    <button class="sidebar-overlay" id="sidebarOverlay" type="button" aria-label="关闭导航侧栏" tabindex="-1" aria-hidden="true" hidden></button>

    <main class="workspace">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenuBtn" type="button" aria-label="打开导航侧栏" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="report-heading">
          <h1 id="reportTitle">Customer Type</h1>
          <p><span class="top-status" id="topKnowledgeStatus">知识包已加载</span></p>
        </div>
      </header>

      <section class="conversation" id="conversation" aria-label="对话内容" aria-live="polite">
        <div class="conversation-inner">
          <section class="welcome-state" id="welcomeState">
            <div class="welcome-panel">
              <div class="welcome-kicker">CONSUMER HIVE INTELLIGENCE</div>
              <h1>让每个指标，<span>都有据可循。</span></h1>
              <p class="welcome-copy">请围绕所选报表询问指标逻辑；若有效问题尚未收录，我将反馈给报表负责人。</p>
              <div class="quick-title">猜你想问</div>
              <div class="quick-questions" id="quickQuestions"></div>
            </div>
          </section>
          <div class="message-list" id="messageList"></div>
        </div>
      </section>

      <footer class="composer">
        <div class="composer-inner">
          <div class="composer-box">
            <label class="sr-only" for="questionInput">输入指标问题</label>
            <textarea id="questionInput" rows="1" maxlength="500" placeholder="输入与 Customer Type 相关的指标问题…" aria-describedby="composerHint"></textarea>
            <button class="send-button" id="sendBtn" type="button" aria-label="发送问题">↑</button>
          </div>
          <div class="composer-meta" id="composerHint">
            <span>Enter 发送 · Shift+Enter 换行</span>
            <span><span id="characterCount">0</span>/500 · 回答基于已审核知识内容，请结合正式业务口径使用</span>

      return String(value).replace(/[&<>"']/g, (character) => ({

    function syncReportControl() {

        option.setAttribute('aria-selected', String(option.dataset.reportOption === appState.reportKey));
      });
    }

    function closeReportMenu(options) {
      const { restoreFocus = false } = options || {};
      reportMenu.hidden = true;
      reportTrigger.setAttribute('aria-expanded', 'false');
      if (restoreFocus) reportTrigger.focus();
    }

    function openReportMenu() {
      reportMenu.hidden = false;
      reportTrigger.setAttribute('aria-expanded', 'true');
      const selectedOption = reportMenu.querySelector('[aria-selected="true"]');
      if (selectedOption) selectedOption.focus();
    }

    function toggleReportMenu() {
      if (reportMenu.hidden) {
        openReportMenu();
      } else {
        closeReportMenu({ restoreFocus: true });
      }
    }

    function applyReportSelection(reportKey) {
      if (!reportConfigs[reportKey]) return;
      appState.reportKey = reportKey;
      updateReportContext();
      renderQuickQuestions();
      closeReportMenu({ restoreFocus: true });
      if (window.matchMedia('(max-width: 767px)').matches) closeSidebar();
    }

    function moveReportOptionFocus(direction) {
      const options = Array.from(reportMenu.querySelectorAll('[data-report-option]'));
      const currentIndex = Math.max(0, options.indexOf(document.activeElement));
      const nextIndex = Math.max(0, Math.min(currentIndex + direction, options.length - 1));
      options[nextIndex].focus();
    }

    function handleReportMenuKeydown(event) {
      const reportOption = event.target.closest('[data-report-option]');
      if (!reportOption) return;

      if (event.key === 'Tab') {
        setTimeout(() => closeReportMenu(), 0);
        return;
      }

      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        closeReportMenu({ restoreFocus: true });
        return;
      }

      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        applyReportSelection(reportOption.dataset.reportOption);
        return;
      }

      const options = Array.from(reportMenu.querySelectorAll('[data-report-option]'));
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        moveReportOptionFocus(event.key === 'ArrowDown' ? 1 : -1);
      } else if (event.key === 'Home' || event.key === 'End') {
        event.preventDefault();
        options[event.key === 'Home' ? 0 : options.length - 1].focus();
      }
    }

      const targetReports = Object.entries(reportConfigs).filter(([targetKey, config]) =>
        targetKey !== reportKey && config.routePatterns.length
      );
      const configuredTarget = targetReports.find(([, config]) => config.questions.includes(question));
      const patternTarget = targetReports.find(([, config]) =>
        config.routePatterns.some((pattern) => pattern.test(question))
      );
      const target = configuredTarget || patternTarget;
      if (!target) return null;
      const [targetKey, config] = target;
      return { ...knowledgeResponses.crossReport, targetReport: config.name, targetKey };
    }

      const config = reportConfigs[reportKey];

          suggestions: config.questions.slice(0, 2)

      if (/天气|股票|电影|音乐|菜谱|旅游|新闻|足球|星座/.test(question)) return knowledgeResponses.outOfScope;
      const crossReportRoute = findCrossReportRoute(question, reportKey);
      if (crossReportRoute) return crossReportRoute;
      if (/购买频次|交易次数/.test(question)) return knowledgeResponses.purchaseFrequency;
      if (/大单|团购|游客单|小样单/.test(question)) return knowledgeResponses.bigOrder;

      if (/新客定义|新客是|首次有效购买/.test(question)) return knowledgeResponses.newCustomer;
      if (/退款|取消/.test(question)) return knowledgeResponses.refund;
      if (/招新|首次购买|新客率/.test(question)) return knowledgeResponses.acquisition;
      if (/复购|一天多单|多笔订单|跨渠道/.test(question)) return knowledgeResponses.repurchase;
      if (/更新|刷新|数据到/.test(question)) return knowledgeResponses.update;
      if (/客数|同比|会员|订单|柜台|渠道|指标|口径|报表|数据/.test(question)) return knowledgeResponses.unknown;
      return knowledgeResponses.outOfScope;
    }

          <section class="answer-section"><h3>说明</h3><ul class="rule-list">${response.rules.map((rule) => `<li>${escapeHtml(rule)}</li>`).join('')}</ul></section>
          <div class="scope-note">提问时所选报表：${escapeHtml(snapshot.name)}</div>
          <button class="citation-toggle" type="button" aria-expanded="false" aria-controls="${citationId}">查看知识依据 <span class="citation-chevron" aria-hidden="true">⌄</span></button>
          <div class="citations" id="${citationId}" hidden><small class="citation-package">知识包：${escapeHtml(snapshot.knowledgePackageName)}</small><strong>${escapeHtml(citationLabel(response, snapshot))}</strong><small>${escapeHtml(response.version)} · 更新于 ${escapeHtml(response.updated)}</small><small>负责人：${escapeHtml(response.owner)}</small></div>
          ${renderSuggestions(response.suggestions)}
          ${renderFeedback()}`;
      }

      node.appendChild(bubble);
      messageList.appendChild(node);
      scrollToLatest();
    }

    function toggleCitation(button) {
      const citation = document.getElementById(button.getAttribute('aria-controls'));
      if (!citation) return;
      const willOpen = citation.hidden;
      citation.classList.toggle('open', willOpen);
      citation.hidden = !willOpen;
      button.setAttribute('aria-expanded', String(willOpen));
    }

    function submitFeedback(button, value) {
      button.parentElement.querySelectorAll('button').forEach((item) => {
        const isSelected = item === button;
        item.classList.toggle('selected', isSelected);
        item.setAttribute('aria-pressed', String(isSelected));
      });
      showToast(value === 'up' ? '感谢反馈 · 已标记为有帮助' : '反馈已记录');
    }

    function addUserMessage(question) {
      const node = document.createElement('article');
      node.className = 'message user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = question;
      node.appendChild(bubble);
      messageList.appendChild(node);
    }

    function addTypingIndicator(snapshot) {
      const node = document.createElement('article');
      node.className = 'message assistant';
      node.id = 'typingIndicator';
      node.innerHTML = `<div class="avatar" aria-hidden="true">✦</div><div class="typing-bubble" role="status"><i></i><i></i><i></i><span>正在核对 ${escapeHtml(snapshot.name)} 的已审核口径</span></div>`;
      messageList.appendChild(node);
      scrollToLatest();
    }

    function renderError(error, snapshot) {
      const node = document.createElement('article');
      node.className = 'message assistant';
      node.innerHTML = '<div class="avatar" aria-hidden="true">✦</div>';
      const bubble = document.createElement('div');
      bubble.className = 'bubble error-message';
      bubble.setAttribute('role', 'alert');
      bubble.innerHTML = `
        <div class="answer-title">暂时无法生成回答</div>
        <div class="answer-lead">这次处理没有完成。输入和新建对话已经恢复，请稍后重试。</div>
        <div class="scope-note">提问时所选报表：${escapeHtml(snapshot.name)}</div>`;
      node.appendChild(bubble);
      messageList.appendChild(node);
      scrollToLatest();
      void error;
    }

    function setInteractionBusy(isBusy) {
      appState.isTyping = isBusy;
      sendBtn.disabled = isBusy;
      newChatBtn.disabled = isBusy;
      newChatBtn.title = isBusy ? '正在生成回答，请稍候' : '';
    }

    function setConversationTitle(question) {
      if (appState.hasMessages) return;
      const title = question.length > 22 ? `${question.slice(0, 22)}…` : question;
      document.getElementById('recentConversation').innerHTML = `<div class="history-item" title="${escapeHtml(question)}">${escapeHtml(title)}<span class="conversation-note">当前会话 · 刷新后重置</span></div>`;
    }

    function sendQuestion(question) {
      const text = String(question || questionInput.value).trim().slice(0, 500);
      if (!text || appState.isTyping) return;

      const snapshot = currentSnapshot();
      setConversationTitle(text);
      appState.hasMessages = true;
      welcomeState.hidden = true;
      addUserMessage(text);
      questionInput.value = '';
      updateCharacterCount();
      resizeTextarea();
      setInteractionBusy(true);
      addTypingIndicator(snapshot);

      window.setTimeout(() => {
        try {
          renderAnswer(pickResponse(text, snapshot.key), snapshot);
        } catch (error) {
          renderError(error, snapshot);
        } finally {
          const typingIndicator = document.getElementById('typingIndicator');
          if (typingIndicator) typingIndicator.remove();
          setInteractionBusy(false);
          questionInput.focus();
        }
      }, 650);
    }

    function startNewChat() {
      if (appState.isTyping) return;
      messageList.replaceChildren();
      appState.hasMessages = false;
      welcomeState.hidden = false;
      document.getElementById('recentConversation').innerHTML = '<div class="recent-empty">首次提问后显示当前会话标题<span class="conversation-note">当前会话 · 刷新后重置</span></div>';
      questionInput.value = '';
      updateCharacterCount();
      resizeTextarea();
      closeSidebar();
      showToast('已新建对话，当前报表选择保持不变');
      questionInput.focus();
    }

    function openSidebar() {
      if (!window.matchMedia('(max-width: 767px)').matches) return;
      appState.lastSidebarTrigger = document.activeElement;
      appState.sidebarOpen = true;
      appShell.classList.add('sidebar-open');
      document.getElementById('sidebar').removeAttribute('inert');
      document.getElementById('sidebar').setAttribute('aria-hidden', 'false');
      document.getElementById('mobileMenuBtn').setAttribute('aria-expanded', 'true');
      syncSidebarOverlay();
      window.clearTimeout(appState.sidebarFocusTimer);
      appState.sidebarFocusTimer = window.setTimeout(() => {
        if (appState.sidebarOpen && window.matchMedia('(max-width: 767px)').matches) newChatBtn.focus();
        appState.sidebarFocusTimer = null;
      }, 200);
    }

    function closeSidebar() {
      if (!appState.sidebarOpen) return;
      appState.sidebarOpen = false;
      closeReportMenu();
      window.clearTimeout(appState.sidebarFocusTimer);
      appState.sidebarFocusTimer = null;
      appShell.classList.remove('sidebar-open');
      if (window.matchMedia('(max-width: 767px)').matches) {
        document.getElementById('sidebar').setAttribute('inert', '');
        document.getElementById('sidebar').setAttribute('aria-hidden', 'true');
      }
      document.getElementById('mobileMenuBtn').setAttribute('aria-expanded', 'false');
      syncSidebarOverlay();
      if (appState.lastSidebarTrigger && typeof appState.lastSidebarTrigger.focus === 'function') {
        appState.lastSidebarTrigger.focus();
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      window.clearTimeout(appState.toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      appState.toastTimer = window.setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function scrollToLatest() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function updateCharacterCount() {
      document.getElementById('characterCount').textContent = String(questionInput.value.length);
    }

    function resizeTextarea() {
      questionInput.style.height = 'auto';
      questionInput.style.height = `${Math.min(questionInput.scrollHeight, 132)}px`;
    }

    function syncSidebarOverlay() {
      const overlay = document.getElementById('sidebarOverlay');
      const isOpenOnMobile = appState.sidebarOpen && window.matchMedia('(max-width: 767px)').matches;
      overlay.hidden = !isOpenOnMobile;
      overlay.setAttribute('aria-hidden', String(!isOpenOnMobile));
      overlay.tabIndex = isOpenOnMobile ? 0 : -1;
    }

    function syncSidebarAccessibility() {
      const sidebar = document.getElementById('sidebar');
      if (window.matchMedia('(max-width: 767px)').matches && !appState.sidebarOpen) {
        sidebar.setAttribute('inert', '');
        sidebar.setAttribute('aria-hidden', 'true');
      } else {
        sidebar.removeAttribute('inert');
        sidebar.setAttribute('aria-hidden', 'false');
      }
      syncSidebarOverlay();
    }

    reportTrigger.addEventListener('click', toggleReportMenu);
    reportMenu.addEventListener('keydown', handleReportMenuKeydown);
    document.getElementById('newChatBtn').addEventListener('click', startNewChat);
    document.getElementById('mobileMenuBtn').addEventListener('click', openSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);
    sendBtn.addEventListener('click', () => sendQuestion());

    questionInput.addEventListener('input', () => {
      updateCharacterCount();
      resizeTextarea();
    });

    questionInput.addEventListener('keydown', (event) => {
      const isComposing = event.isComposing || event.keyCode === 229;
      if (event.key === 'Enter' && !event.shiftKey && !isComposing) {
        event.preventDefault();
        sendQuestion();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!reportMenu.hidden) {
        closeReportMenu({ restoreFocus: true });
      } else if (appState.sidebarOpen) {
        closeSidebar();
      }
    });

    document.addEventListener('click', (event) => {
      const reportOption = event.target.closest('[data-report-option]');
      if (reportOption) {
        applyReportSelection(reportOption.dataset.reportOption);
      } else if (!event.target.closest('.report-control')) {
        closeReportMenu();
      }

      const questionButton = event.target.closest('[data-question]');
      if (questionButton) sendQuestion(questionButton.dataset.question);

      const citationButton = event.target.closest('.citation-toggle');
      if (citationButton) toggleCitation(citationButton);

      const feedbackButton = event.target.closest('[data-feedback]');
      if (feedbackButton) submitFeedback(feedbackButton, feedbackButton.dataset.feedback);

      const reportButton = event.target.closest('[data-report-target]');
      if (reportButton) {
        applyReportSelection(reportButton.dataset.reportTarget);
        showToast('已切换报表，可继续提问');
      }
    });

    function handleViewportResize() {
      closeReportMenu();
      if (!window.matchMedia('(max-width: 767px)').matches && appState.sidebarOpen) closeSidebar();
      syncSidebarAccessibility();
    }

    window.addEventListener('resize', handleViewportResize);

    renderQuickQuestions();
    syncReportControl();
    updateCharacterCount();
    syncSidebarAccessibility();
  </script>
</body>
</html>
